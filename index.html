<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>VoltTrack – Bike Battery Manager</title>
<style>
:root{--navy:#0B1220;--blue:#2563EB;--green:#22C55E;--bg:#F3F6FA;--card:#fff;--tx:#1E293B;--mut:#64748B;--bd:#E2E8F0;--amb:#F59E0B;--red:#EF4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#131C2E;--tx:#E2E8F0;--mut:#94A3B8;--bd:#24304A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#131C2E;--tx:#E2E8F0;--mut:#94A3B8;--bd:#24304A;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--navy);color:#cbd5e1;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{color:#fff;font-weight:700;font-size:18px;padding:4px 10px 16px}.logo span{color:var(--green)}
nav a{display:flex;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:.15s}
nav a:hover{background:#1e293b;color:#fff}nav a.on{background:var(--blue);color:#fff}
main{padding:22px;min-width:0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}.sub{color:var(--mut);margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.06);margin-bottom:14px}
.grid .card{margin:0}.stat b{display:block;font-size:24px}.stat small{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.sp{flex:1}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-size:12px;text-transform:uppercase}
button,.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;transition:.15s}button:hover{filter:brightness(1.1)}
button.g{background:var(--green);color:#052e16}button.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--red)}button.s{padding:4px 9px;font-size:12px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.badge{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;display:inline-block}
.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.info{background:#dbeafe;color:#1e40af}
dialog{border:0;border-radius:14px;padding:20px;width:min(720px,94vw);max-height:92vh;background:var(--card);color:var(--tx)}dialog::backdrop{background:rgba(2,6,23,.6)}
.bars{display:flex;gap:10px;align-items:flex-end;height:140px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars i{display:block;background:var(--blue);border-radius:6px 6px 0 0;margin-bottom:4px}
.empty{padding:24px;text-align:center;color:var(--mut)}.bf{border-color:var(--red)!important;outline:1px solid var(--red)}.fe{color:var(--red);font-size:12px}#wdlg,#cdlg{width:min(460px,94vw)}
#toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99}
.inv{background:#fff;color:#111;padding:18px;font-size:13px}.inv table th{color:#555}.inv td,.inv th{padding:6px 8px}.tot{margin-left:auto;width:280px}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{height:auto;position:static;display:flex;overflow-x:auto;padding:8px}.logo{display:none}nav a{white-space:nowrap}}
.inv hr{margin:10px 0;border:0;border-top:2px solid #2563EB}.inv.pdf{width:210mm;padding:14mm 15mm;font-size:12.5px}
@page{size:A4;margin:0}
@media print{html,body{margin:0!important;padding:0!important;background:#fff!important;height:auto!important}:root{padding:0!important}.app,#toast,.np,#wdlg,#cdlg{display:none!important}#dlg{position:absolute!important;top:0!important;left:0!important;margin:0!important;width:210mm!important;max-width:none!important;height:auto!important;max-height:none!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;background:#fff!important}#dlg::backdrop{display:none}.inv{padding:14mm 15mm!important;font-size:12.5px;width:210mm;margin:0;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}.inv table,.inv p{break-inside:avoid}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script></head><body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<dialog id="dlg"></dialog><dialog id="cdlg"></dialog><dialog id="wdlg"></dialog><div id="toast"></div>
<script>
const K='volttrack.v1',$=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const addM=(d,m)=>{const x=new Date(d);x.setMonth(x.getMonth()+Number(m));return x.toISOString().slice(0,10)};
const uid=p=>p+Math.random().toString(36).slice(2,8);
let db,view='Dashboard',arg=null,q='';
function seed(){const c=[{id:'C-1001',name:'Rahul Patel',mobile:'9876543210',alt:'',email:'rahul@example.com',address:'12 Shivam Society',city:'Ahmedabad',state:'Gujarat',pin:'380015',reg:'GJ01AB1234',brand:'Honda',model:'Activa 6G',chassis:'',created:'2026-01-10'},{id:'C-1002',name:'Meera Shah',mobile:'9898012345',alt:'',email:'',address:'45 Satellite Rd',city:'Ahmedabad',state:'Gujarat',pin:'380054',reg:'GJ05CD5678',brand:'TVS',model:'Jupiter',chassis:'',created:'2026-03-02'},{id:'C-1003',name:'Imran Khan',mobile:'9825011111',alt:'9825022222',email:'',address:'7 Navrangpura',city:'Ahmedabad',state:'Gujarat',pin:'380009',reg:'GJ27EF9012',brand:'Bajaj',model:'Pulsar 150',chassis:'',created:'2026-05-15'}];
const p=[{id:'B-001',brand:'Exide',model:'XLTZ5',type:'Lead Acid',cap:'5Ah',volt:'12V',buy:900,sell:1450,wm:24,wterms:'Free replacement for manufacturing defects',supplier:'PowerHub Traders',stock:14,min:5,desc:'Bike tracker backup battery'},{id:'B-002',brand:'Amaron',model:'AAM-PR-9',type:'Li-ion',cap:'9Ah',volt:'12V',buy:1500,sell:2300,wm:18,wterms:'Pro-rata after 12 months',supplier:'VoltWorld',stock:3,min:5,desc:'Long-life tracker battery'},{id:'B-003',brand:'Livguard',model:'LG-4L',type:'Gel',cap:'4Ah',volt:'12V',buy:700,sell:1150,wm:12,wterms:'Warranty void on physical damage',supplier:'PowerHub Traders',stock:20,min:6,desc:'Compact gel battery'}];
const s={biz:'VoltTrack Batteries',addr:'Shop 5, Ring Road, Ahmedabad, Gujarat',phone:'+91 99999 00000',gstin:'24ABCDE1234F1Z5',gst:18,terms:'Goods once sold will not be taken back. Warranty as per terms stated above.',soon:30,inv:3};
const mk=(n,ci,bi,date,qty,disc,paid,m,ser)=>calc({id:'P-'+(1000+n),invNo:'INV-'+String(n).padStart(4,'0'),cid:ci,bid:bi,date,install:date,qty,disc,gst:18,method:m,paid,serial:ser,notes:'',claims:[]},c,p);
return{customers:c,products:p,settings:s,purchases:[mk(1,'C-1001','B-001','2026-02-01',1,0,1711,'UPI','EX-5501'),mk(2,'C-1002','B-002','2026-06-20',1,100,1000,'Cash','AM-9002'),mk(3,'C-1003','B-003','2025-12-01',2,50,2500,'Card','LG-4403')]}}
function calc(x,cs=db.customers,ps=db.products){const c=cs.find(a=>a.id===x.cid),b=ps.find(a=>a.id===x.bid);
x.cust={...c};x.bat={brand:b.brand,model:b.model,wm:b.wm,wterms:b.wterms};x.unit=x.unit??b.sell;
x.sub=x.qty*x.unit;x.taxable=Math.max(0,x.sub-x.disc);x.tax=+(x.taxable*x.gst/100).toFixed(2);x.total=+(x.taxable+x.tax).toFixed(2);
x.paid=Math.min(x.paid,x.total);x.bal=+(x.total-x.paid).toFixed(2);x.pstat=x.bal<=0?'Paid':x.paid>0?'Partially Paid':'Unpaid';
x.wstart=x.date;x.wend=addM(x.date,x.bat.wm);return x}
const API_URL=''; // <-- set to your backend URL after deploying, e.g. 'https://volttrack-api.onrender.com'
const useApi=()=>!!API_URL;
let auth=null,saving=false;try{auth=JSON.parse(sessionStorage.getItem('vt.auth'))}catch(_){}
async function apiFetch(path,opt={}){let r;try{r=await fetch(API_URL.replace(/\/$/,'')+path,{...opt,cache:'no-store',headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+auth.token}:{})}})}catch(_){throw new Error('Cannot reach the server')}
let j={};try{j=await r.json()}catch(_){}if(r.status===401&&auth){auth=null;try{sessionStorage.removeItem('vt.auth')}catch(_){}loginDlg()}
if(!r.ok){const er=new Error(j.error||'Request failed');er.status=r.status;er.errors=j.errors;throw er}return j}
const cs={status:'idle',total:null,err:''};let syncSeq=0,syncBusy=0;
const custCount=()=>!useApi()?db.customers.length:cs.status==='ok'?cs.total:(cs.status==='error'?'—':'…');
function csBanner(){if(!useApi())return'<div class="card"><span class="badge warn">Local-only mode</span> This site is not connected to the backend, so customers are stored only in this browser and will differ between devices. Set <b>API_URL</b> in index.html.</div>';
if(!auth)return'';if(cs.status==='ok')return'';if(cs.status==='error')return`<div class="card"><span class="badge bad">Server unavailable</span> ${e(cs.err)} <button class="s" onclick="syncCustomers()">Retry</button></div>`;return'<div class="card sub">Loading customers from the server…</div>'}
async function fetchAll(arch){let rows=[],off=0,total=null;for(;;){const r=await apiFetch('/api/customers?archived='+arch+'&limit=500&offset='+off);if(typeof r.total!=='number')throw new Error('Backend is out of date (no total count) - redeploy the backend');
rows=rows.concat(r.customers);total=r.total;off+=500;if(!r.customers.length||rows.length>=total)break}return{rows,total}}
async function syncCustomers(quiet){if(!useApi()||!auth)return;if(quiet&&syncBusy)return;const t=++syncSeq;syncBusy++;if(!quiet&&cs.status!=='ok'){cs.status='loading';render()}
try{const[a,b]=await Promise.all([fetchAll(false),fetchAll(true)]);if(t!==syncSeq)return;db.customers=a.rows;db.archived=b.rows;cs.status='ok';cs.total=a.total;cs.err=''}
catch(er){if(t!==syncSeq)return;cs.status='error';cs.err=er.status===401?'Session expired - sign in again':er.message}finally{syncBusy--}
const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(!quiet||!($('#dlg').open||$('#wdlg').open||$('#cdlg').open||typing))render()}
function loginDlg(msg){const d=$('#cdlg');d.oncancel=ev=>ev.preventDefault();d.innerHTML=`<h2>Sign in to VoltTrack</h2><form onsubmit="event.preventDefault();doLogin(this)"><div class="f" style="grid-template-columns:1fr"><div><label>Email</label><input name="email" type="email" autocomplete="username"></div><div><label>Password</label><input name="password" type="password" autocomplete="current-password"></div></div><div class="fe" id="lerr">${e(msg||'')}</div><div class="row" style="margin-top:12px"><button>Sign in</button></div></form>`;if(!d.open)d.showModal()}
async function doLogin(f){if(saving)return;saving=true;const b=f.querySelector('button');b.disabled=true;try{const r=await apiFetch('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});auth=r;try{sessionStorage.setItem('vt.auth',JSON.stringify(r))}catch(_){}await syncCustomers();$('#cdlg').oncancel=null;$('#cdlg').close();toast('Signed in')}catch(er){$('#lerr').textContent=er.status===401?'Invalid email or password':er.message;b.disabled=false}finally{saving=false}}
function logout(){auth=null;try{sessionStorage.removeItem('vt.auth')}catch(_){}db.customers=[];db.archived=[];render();loginDlg()}
function legacyBackup(fresh){try{if(!localStorage.getItem('vt.legacy')&&(db.customers.length||(db.archived||[]).length)&&!fresh)localStorage.setItem('vt.legacy',JSON.stringify({customers:db.customers,archived:db.archived||[]}))}catch(_){}}
const legacyBtn=()=>useApi()&&auth?.role==='admin'&&localStorage.getItem('vt.legacy')&&!localStorage.getItem('vt.legacyDone')?'<button class="o" onclick="importLegacy()">Import customers saved in this browser</button>':'';
async function importLegacy(){let L;try{L=JSON.parse(localStorage.getItem('vt.legacy'))}catch(_){}const list=[...(L?.customers||[]),...(L?.archived||[])];if(!list.length){localStorage.setItem('vt.legacyDone','1');return render()}
try{const r=await apiFetch('/api/customers/import',{method:'POST',body:JSON.stringify({customers:list})});localStorage.setItem('vt.legacyDone','1');const mp={};(r.map||[]).forEach(m=>mp[m.from]=m.to);db.purchases.forEach(x=>{if(mp[x.cid])x.cid=mp[x.cid]});save();await syncCustomers();warn('Import finished','Imported '+r.imported+', skipped '+r.skipped.length+' already on the server, '+r.invalid.length+' invalid (not imported). The copy in this browser is kept as a backup.')}catch(er){toast('Import failed: '+er.message)}}
async function apiDel(id){try{await apiFetch('/api/customers/'+id,{method:'DELETE'});await syncCustomers();if(view==='Profile')go('Customers');toast('Customer archived')}catch(er){toast(er.status===403?'Only administrators can archive customers':er.message)}}
async function apiRestore(id){try{await apiFetch('/api/customers/'+id+'/restore',{method:'POST'});await syncCustomers();toast('Customer restored')}catch(er){toast(er.errors?.reg||(er.status===403?'Only administrators can restore customers':er.message))}}
function boot(){if(!useApi())return;if(!auth)loginDlg();else syncCustomers();setInterval(()=>syncCustomers(true),30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncCustomers(true)})}
function load(){try{db=JSON.parse(localStorage.getItem(K))}catch(_){}const fresh=!db;if(!db)db=seed();migrate();if(useApi()){legacyBackup(fresh);db.customers=[];db.archived=[]}save()}
function save(){try{localStorage.setItem(K,JSON.stringify(useApi()?{...db,customers:[],archived:[]}:db));return true}catch(_){return false}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function ws(x){const d=Math.ceil((new Date(x.wend)-new Date(today()))/864e5);return d<0?['Warranty Expired','bad',d]:d<=db.settings.soon?['Expiring Soon','warn',d]:['Active Warranty','ok',d]}
const wb=x=>{const[a,b]=ws(x);return`<span class="badge ${b}">${a}</span>`};
const pb=s=>`<span class="badge ${s==='Paid'?'ok':s==='Unpaid'?'bad':'warn'}">${s}</span>`;
const cust=id=>db.customers.find(c=>c.id===id),prod=id=>db.products.find(c=>c.id===id);
const T=(h,rows)=>rows.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`:`<div class="empty">${q?'No results match your search.':'Nothing here yet – use the Add button to create the first record.'}</div>`;
const NAV=[['Dashboard','▦'],['Customers','👤'],['Battery Products','🔋'],['Battery Stock','📦'],['Purchases','🧾'],['Invoices','📄'],['Warranty','🛡'],['Suppliers','🚚'],['Reports','📊'],['Settings','⚙']];
function go(v,a=null){view=v;arg=a;q='';render()}
function render(){$('#nav').innerHTML='<div class="logo">⚡ Volt<span>Track</span></div>'+NAV.map(([n,i])=>`<a class="${view===n||(view==='Profile'&&n==='Customers')?'on':''}" onclick="go('${n}')">${i} ${n}</a>`).join('');
if(useApi()&&auth)$('#nav').insertAdjacentHTML('beforeend','<a onclick="logout()">⏻ Sign out ('+e(auth.role)+')</a>');$('#main').innerHTML=V[view]();}
const srch=ph=>`<input style="max-width:280px" placeholder="${ph}" value="${e(q)}" oninput="q=this.value;const p=this.selectionStart;render();const i=document.querySelector('main input');i.focus();i.setSelectionRange(p,p)">`;
const has=(q,...f)=>!q||f.some(x=>String(x||'').toLowerCase().includes(q.toLowerCase()));
const V={
Dashboard(){const P=db.purchases,m=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const k=d.toISOString().slice(0,7);m.push([d.toLocaleString('en',{month:'short'}),P.filter(x=>x.date.startsWith(k)).reduce((a,x)=>a+x.total,0)])}
const mx=Math.max(1,...m.map(a=>a[1])),low=db.products.filter(p=>p.stock<=p.min);
return`<h1>Dashboard</h1>${csBanner()}<div class="sub">Overview of your battery business</div><div class="row"><button onclick="custForm()">+ Add Customer</button><button class="g" onclick="purForm()">Record Purchase</button><button class="o" onclick="go('Invoices')">Generate Invoice</button></div>
<div class="grid">${[['Customers',custCount()],['Batteries sold',P.reduce((a,x)=>a+x.qty,0)],['Total sales',money(P.reduce((a,x)=>a+x.total,0))],['Invoices',P.length],['Under warranty',P.filter(x=>ws(x)[2]>=0).length]].map(([l,v])=>`<div class="card stat"><small>${l}</small><b>${v}</b></div>`).join('')}</div>
${low.length?`<div class="card"><span class="badge warn">Low stock</span> ${low.map(p=>e(p.brand+' '+p.model)+' ('+p.stock+')').join(', ')}</div>`:''}
<div class="card"><h2>Monthly sales</h2><div class="bars">${m.map(([l,v])=>`<div><i style="height:${v/mx*110}px"></i>${l}</div>`).join('')}</div></div>
<div class="card"><h2>Recent purchases</h2>${T(['Invoice','Customer','Battery','Total','Status'],[...P].reverse().slice(0,5).map(x=>`<tr><td>${x.invNo}</td><td>${e(x.cust.name)}</td><td>${e(x.bat.brand+' '+x.bat.model)}</td><td>${money(x.total)}</td><td>${pb(x.pstat)}</td></tr>`))}</div>
<div class="card"><h2>Recent customers</h2>${T(['Name','Mobile','Bike'],[...db.customers].reverse().slice(0,4).map(c=>`<tr><td>${e(c.name)}</td><td>${e(c.mobile)}</td><td>${e(c.reg)}</td></tr>`))}</div>`},
Customers(){if(useApi()&&cs.status!=='ok')return`<h1>Customers</h1>${csBanner()}`;const L=db.customers.filter(c=>has(q,c.name,c.mobile,c.reg));return`<h1>Customers</h1>${csBanner()}<div class="row">${srch('Search name, mobile or bike no.')}<div class="sp"></div><button onclick="custForm()">+ Add customer</button>${legacyBtn()}</div><div class="card">${T(['ID','Name','Mobile','Bike','Reg. no.','Actions'],L.map(c=>`<tr><td>${c.id}</td><td>${e(c.name)}</td><td>${e(c.mobile)}</td><td>${e(c.brand+' '+c.model)}</td><td>${e(c.reg)}</td><td><button class="s" onclick="go('Profile','${c.id}')">View</button> <button class="s o" onclick="custForm('${c.id}')">Edit</button> <button class="s d" onclick="delCust('${c.id}')">Delete</button></td></tr>`))}</div>${(db.archived||[]).length?`<div class="card"><h2>Archived customers</h2>${T(['ID','Name','Reg. no.','Archived',''],db.archived.map(c=>`<tr><td>${c.id}</td><td>${e(c.name)}</td><td>${e(c.reg)}</td><td>${c.archivedOn}</td><td><button class="s" onclick="restoreCust('${c.id}')">Restore</button></td></tr>`))}</div>`:''}`},
Profile(){const c=cust(arg);if(!c)return'<div class="empty">Not found</div>';const P=db.purchases.filter(x=>x.cid===c.id);
return`<button class="o s" onclick="go('Customers')">← Back</button><h1>${e(c.name)} <small style="color:var(--mut)">${c.id}</small></h1><div class="grid"><div class="card stat"><small>Total spent</small><b>${money(P.reduce((a,x)=>a+x.total,0))}</b></div><div class="card stat"><small>Outstanding</small><b>${money(P.reduce((a,x)=>a+x.bal,0))}</b></div></div>
<div class="card"><h2>Details</h2><p>${e(c.mobile)} ${c.alt?'/ '+e(c.alt):''} ${c.email?'· '+e(c.email):''}<br>${e(c.address)}, ${e(c.city)}, ${e(c.state)} ${e(c.pin)}<br>Bike: ${e(c.brand+' '+c.model)} · ${e(c.reg)} ${c.chassis?'· Chassis '+e(c.chassis):''}</p></div>
<div class="card"><h2>Purchase history</h2>${T(['Date','Invoice','Battery','Serial','Paid','Warranty','',''],P.map(x=>`<tr><td>${x.date}</td><td>${x.invNo}</td><td>${e(x.bat.brand+' '+x.bat.model)}</td><td>${e(x.serial)}</td><td>${money(x.paid)} ${pb(x.pstat)}</td><td>${wb(x)}</td><td><button class="s" onclick="showInv('${x.id}')">Invoice</button></td></tr>`))}</div>`},

function formSubmit(f){if(f.dataset.busy)return;clearErr(f);f.dataset.busy=1;let r;try{r=_save(Object.fromEntries(new FormData(f)))}catch(er){console.error(er);toast('Unexpected error – nothing was saved');r=false}if(r===false){delete f.dataset.busy;return}close_()}
function clearErr(f){f.querySelectorAll('.bf').forEach(x=>x.classList.remove('bf'));f.querySelectorAll('.fe').forEach(x=>x.textContent='')}
function fieldErr(f,n,m){const el=f.elements[n];if(!el)return;el.classList.add('bf');const w=el.parentElement;let fe=w.querySelector('.fe');if(!fe){fe=document.createElement('div');fe.className='fe';w.appendChild(fe)}fe.textContent=m;el.focus()}
function warn(t,m,cancel){$('#wdlg').innerHTML=`<h2>${e(t)}</h2><p>${e(m)}</p><div class="row"><button onclick="$('#wdlg').close()">OK</button>${cancel?`<button class="o" onclick="$('#wdlg').close();close_()">Cancel</button>`:''}</div>`;$('#wdlg').showModal()}
function normMobile(s){let d=String(s||'').replace(/[\s\-().]/g,'');if(/^\+91/.test(d))d=d.slice(3);else if(/^91\d{10}$/.test(d))d=d.slice(2);else if(/^0\d{10}$/.test(d))d=d.slice(1);return /^[6-9]\d{9}$/.test(d)&&!/^(\d)\1{9}$/.test(d)?d:''}
function validPur(f,d,b){clearErr(f);const c=cust(d.cid),bad=(n,m)=>{fieldErr(f,n,m);warn('Check purchase details',m);return false};
if(!c)return bad('cid','Please select a customer.');if(!normMobile(c.mobile))return bad('cid','This customer has no valid mobile number. Edit the customer first.');
if(!b)return bad('bid','Please select a battery product.');if(!d.serial.trim())return bad('serial','Battery serial number is required.');
if(db.purchases.some(x=>x.serial===d.serial.trim()))return bad('serial','This serial number is already recorded.');
if(!d.date||isNaN(new Date(d.date)))return bad('date','Enter a valid purchase date.');if(d.date>today())return bad('date','Purchase date cannot be in the future.');
if(!(d.qty>0)||!Number.isInteger(d.qty))return bad('qty','Quantity must be a whole number above zero.');if(d.qty>b.stock)return bad('qty','Only '+b.stock+' in stock.');
if(!(b.sell>0))return bad('bid','This battery has no valid selling price.');const t=calc({...d,claims:[]});
if(d.disc<0||d.disc>t.sub)return bad('disc','Discount must be between 0 and the subtotal.');if(!(t.total>0))return bad('disc','Final amount must be above zero.');
if(d.paid<0||d.paid>t.total)return bad('paid','Amount paid cannot exceed the total ('+money(t.total)+').');return true}
function brandSel(v){return `<input name="brand" list="bl" autocomplete="off" placeholder="Search company…" value="${e(v)}"><datalist id="bl">${db.companies.filter(c=>c.active).map(c=>`<option value="${e(c.name)}">`).join('')}</datalist><div class="fe"></div><button type="button" class="s o" style="margin-top:6px" onclick="coDialog('',true)">+ Add Company</button>`}
function coDialog(id,inForm){const v=id?db.companies.find(c=>c.id===id):{};const i=(n,l)=>`<div><label>${l}</label><input name="${n}" value="${e(v[n])}"><div class="fe"></div></div>`;$('#cdlg').innerHTML=`<h2>${id?'Edit':'Add'} battery company</h2><form onsubmit="event.preventDefault();coSubmit(this,'${id||''}',${!!inForm})"><div class="f">${i('name','Company name')}${i('code','Code (optional)')}${i('phone','Contact number (optional)')}${i('web','Website (optional)')}${i('desc','Description (optional)')}<div><label>Status</label><select name="active"><option ${v.active!==false?'selected':''}>Active</option><option ${v.active===false?'selected':''}>Inactive</option></select></div></div><div class="row" style="margin-top:14px"><button>Save</button><button type="button" class="o" onclick="$('#cdlg').close()">Cancel</button></div></form>`;$('#cdlg').showModal()}
function coSubmit(f,id,inForm){if(f.dataset.busy)return;clearErr(f);const d=Object.fromEntries(new FormData(f));d.name=d.name.trim();if(!d.name)return fieldErr(f,'name','Company name is required');if(db.companies.some(c=>c.id!==id&&c.name.toLowerCase()===d.name.toLowerCase()))return fieldErr(f,'name','This company already exists');d.active=d.active==='Active';let c;if(id){c=db.companies.find(x=>x.id===id);Object.assign(c,d);db.products.forEach(p=>{if(p.brandId===id)p.brand=c.name})}else{c={...d,id:'CO-'+String(db.companies.length+1).padStart(3,'0')+Math.floor(Math.random()*9)};db.companies.push(c)}save();$('#cdlg').close();if(inForm){const i=document.querySelector('#dlg input[name=brand]');if(i){i.value=c.name;clearErr($('#dlg form'))}toast('Company added and selected')}else{render();toast('Company saved')}}
function togCo(id){const c=db.companies.find(x=>x.id===id);c.active=!c.active;save();render()}
function coSection(){const L=db.companies.filter(c=>has(q,c.name,c.code));return`<div class="card"><h2>Battery Companies / Brands</h2><div class="row">${srch('Search companies')}<div class="sp"></div><button onclick="coDialog()">+ Add Battery Company</button></div>${T(['ID','Company','Code','Phone','Status',''],L.map(c=>`<tr><td>${c.id}</td><td>${e(c.name)}</td><td>${e(c.code)}</td><td>${e(c.phone)}</td><td><span class="badge ${c.active?'ok':'bad'}">${c.active?'Active':'Inactive'}</span></td><td><button class="s o" onclick="coDialog('${c.id}')">Edit</button> <button class="s o" onclick="togCo('${c.id}')">${c.active?'Deactivate':'Activate'}</button></td></tr>`))}</div>`}
const smsB=s=>`<span class="badge ${s==='Sent'?'ok':s==='Failed'?'bad':'warn'}">${s}</span>`;
const lastSms=(id,t='purchase')=>[...db.sms].reverse().find(s=>s.pid===id&&(s.type||'purchase')===t);
const smsLabel=id=>{const l=lastSms(id);return !l?'Send SMS':l.status==='Failed'?'Retry SMS':'Resend SMS'};
const dmy=d=>d.split('-').reverse().join('-');
const SMS_TYPES=[['purchase','Purchase Confirmation'],['invoice','Invoice Notification'],['payment','Payment Confirmation'],['warranty','Warranty Expiry Reminder']];
const SMS_DEF={purchase:'Dear {customer_name}, your VoltTrack battery purchase is confirmed. Invoice: {invoice_number}. Battery: {battery_company} {battery_model}. Purchase Date: {purchase_date}. Amount: ₹{total_amount}. Warranty: {warranty_duration}. Thank you.',invoice:'Dear {customer_name}, invoice {invoice_number} dated {purchase_date} for ₹{total_amount} is ready. Balance due: ₹{balance_due}.',payment:'Dear {customer_name}, we received your payment against invoice {invoice_number}. Paid: ₹{amount_paid}. Balance due: ₹{balance_due}. Thank you.',warranty:'Dear {customer_name}, the warranty on your {battery_company} {battery_model} (invoice {invoice_number}) expires on {warranty_end}.'};
const SMS_PH=['customer_name','invoice_number','battery_company','battery_model','purchase_date','total_amount','amount_paid','balance_due','warranty_duration','warranty_start','warranty_end'];
const smsCfg=()=>{const c=db.settings.sms=db.settings.sms||{};c.tpl=c.tpl||{};c.tid=c.tid||{};return c};
const inr=n=>Number(n||0).toLocaleString('en-IN');
function smsBody(x,t='purchase'){const m={customer_name:x.cust.name,invoice_number:x.invNo,battery_company:x.bat.brand,battery_model:x.bat.model,purchase_date:dmy(x.date),total_amount:inr(x.total),amount_paid:inr(x.paid),balance_due:inr(x.bal),warranty_duration:x.bat.wm+' months',warranty_start:dmy(x.wstart),warranty_end:dmy(x.wend)};return(smsCfg().tpl[t]||SMS_DEF[t]).replace(/\{(\w+)\}/g,(a,k)=>k in m?m[k]:a)}
let sessKey='';
async function api(path,body){const c=smsCfg();if(!c.backend)throw new Error('Backend URL is not set');const k=$('#ak');if(k&&k.value)sessKey=k.value;const r=await fetch(c.backend.replace(/\/$/,'')+path,{method:body?'POST':'GET',headers:{'content-type':'application/json','x-access-key':sessKey},body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch(_){}return{http:r.status,...j}}
const smsTransport=async log=>{const c=smsCfg();if(!c.enabled)throw new Error('SMS gateway is disabled in Settings');if(!c.backend)throw new Error('SMS backend URL is not configured');let r;
try{r=await api('/api/sms/send',{to:'91'+log.to.slice(3),message:log.body,templateId:c.tid[log.type]||c.tid.def||'',senderId:c.sender||'',entityId:c.entity||''})}catch(_){throw new Error('Gateway unavailable: the SMS backend could not be reached')}
log.mid=r.messageId||'';if(r.accepted)return r.provider||'Accepted by gateway';throw new Error((r.status?r.status+': ':'')+(r.error||'Not accepted'))};
const invOpen=()=>$('#dlg').open&&$('#dlg .inv');
const smsBusy={};
async function smsSend(pid,type='purchase',force){const x=db.purchases.find(p=>p.id===pid);if(!x)return;const k=pid+type,l=lastSms(pid,type);if(smsBusy[k]||l?.status==='Pending')return;
if(l?.status==='Sent'&&!force){$('#wdlg').innerHTML=`<h2>SMS already sent</h2><p>This message was accepted by the gateway on ${l.ts.slice(0,16).replace('T',' ')}. Send it again?</p><div class="row"><button onclick="$('#wdlg').close();smsSend('${pid}','${type}',1)">Send again</button><button class="o" onclick="$('#wdlg').close()">Cancel</button></div>`;$('#wdlg').showModal();return}
const to=normMobile(cust(x.cid)?.mobile||x.cust.mobile);if(!to){warn('Invalid Mobile Number','No valid mobile number is on record for this customer, so no SMS was sent.');return}
smsBusy[k]=1;const log={id:uid('S-'),pid,type,invNo:x.invNo,to:'+91'+to,body:smsBody(x,type),status:'Pending',ts:new Date().toISOString(),resp:'',err:'',mid:''};db.sms.push(log);save();if(invOpen())showInv(pid);
try{log.resp=String(await smsTransport(log)).slice(0,300);log.status='Sent'}catch(er){log.status='Failed';log.err=String(er.message).slice(0,300)}smsBusy[k]=0;save();if(invOpen())showInv(pid);toast('SMS '+(log.status==='Sent'?'accepted by gateway':'failed: '+log.err))}
const stCls={'Connected':'ok','Testing':'info','Not Configured':'warn'};
function smsConfig(){const c=smsCfg(),g=c.gw,I=(id,l,v,x='')=>`<div><label>${l}</label><input id="${id}" value="${e(v)}" ${x}><div class="fe" id="e_${id}"></div></div>`;
return`<div class="card"><h2>C-DAC SMS Gateway Configuration</h2><p class="sub">Credentials are never stored in this app. They live in the SMS backend’s environment variables (see <b>sms-backend/README.md</b>). This page only keeps non-secret settings.</p>
<div class="row"><label style="margin:0"><input type="checkbox" id="s_en" style="width:auto" ${c.enabled?'checked':''}> Enable SMS gateway</label><label style="margin:0"><input type="checkbox" id="s_auto" style="width:auto" ${c.auto?'checked':''}> Send purchase SMS automatically</label></div>
<div class="f">${I('s_be','SMS backend URL (https://…)',c.backend)}<div><label>Backend access key (this session only, never saved)</label><input id="ak" type="password" autocomplete="off" placeholder="${sessKey?'•••••••• (entered)':'Enter to use backend'}"></div>${I('s_sd','Sender ID',c.sender)}${I('s_en2','Entity / Principal Entity ID',c.entity)}${I('s_t0','Default template ID',c.tid.def)}
<div><label>Language / encoding</label><select id="s_lg">${['English (GSM)','Unicode (Hindi/Gujarati)'].map(x=>`<option ${x===c.lang?'selected':''}>${x}</option>`).join('')}</select></div></div>
<div class="card" style="margin:12px 0"><b>Gateway details reported by the backend (read-only)</b><br>${g?`Endpoint: ${e(g.endpointHost||'—')} · Method: ${e(g.method||'—')} · Format: ${e(g.format||'—')} · Auth: ${e(g.authMethod||'—')} · Credentials: <span class="badge ${g.credentials==='configured'?'ok':'bad'}">${e(g.credentials||'unknown')}</span>${g.missing?.length?'<br>Missing: '+e(g.missing.join(', ')):''}`:'Not loaded yet – run Test Connection.'}</div>
<h2>Message templates</h2><p class="sub">Placeholders: ${SMS_PH.map(p=>'{'+p+'}').join(' ')}. Approved DLT text must match exactly.</p>
${SMS_TYPES.map(([k,l])=>`<div style="margin-bottom:10px"><label>${l}</label><textarea id="s_tp_${k}" rows="2">${e(c.tpl[k]||SMS_DEF[k])}</textarea><div class="f" style="margin-top:4px">${I('s_ti_'+k,'DLT template ID for this message',c.tid[k])}</div><div class="fe" id="e_s_tp_${k}"></div></div>`).join('')}
<div class="row"><button onclick="saveSmsCfg()">Save settings</button><button class="o" onclick="render()">Cancel</button></div>
<hr style="border:0;border-top:1px solid var(--bd)"><div class="row"><b>Connection:</b> <span class="badge ${stCls[c.status||'Not Configured']||'bad'}">${c.status||'Not Configured'}</span><span class="sub" style="margin:0">${c.lastTest?'Last test '+c.lastTest.slice(0,16).replace('T',' ')+' – '+e(c.lastResult):'Never tested'}</span><div class="sp"></div><button class="o" onclick="smsTest()" ${c.status==='Testing'?'disabled':''}>Test Connection</button></div>
<p class="sub">“Connected” means the backend reached the gateway and credentials were accepted. It does not prove an SMS can be delivered.</p>
<div class="f"><div><label>Test mobile number</label><input id="ts_n" placeholder="98XXXXXXXX"><div class="fe" id="e_ts_n"></div></div><div><label>Test message</label><input id="ts_m" value="VoltTrack test message"></div></div><div class="row" style="margin-top:8px"><button class="g" onclick="smsTestSend()">Send Test SMS</button><span class="sub" style="margin:0">Never sent automatically.</span></div></div>`}
function saveSmsCfg(){const v=id=>($('#'+id).value||'').trim(),c=smsCfg();document.querySelectorAll('.fe').forEach(x=>x.textContent='');let ok=true;const bad=(id,m)=>{$('#e_'+id).textContent=m;ok=false};
const be=v('s_be');if(be){try{const u=new URL(be);if(!/^https?:$/.test(u.protocol)||(u.protocol==='http:'&&!/^(localhost|127\.0\.0\.1)$/.test(u.hostname)))throw 0}catch(_){bad('s_be','Enter a valid https:// URL')}}
if($('#s_en').checked&&!be)bad('s_be','Backend URL is required to enable SMS');
if(v('s_sd')&&!/^[A-Za-z0-9]{3,11}$/.test(v('s_sd')))bad('s_sd','Sender ID: 3–11 letters/digits');
['s_en2','s_t0',...SMS_TYPES.map(t=>'s_ti_'+t[0])].forEach(id=>{if(v(id)&&!/^\d{5,25}$/.test(v(id)))bad(id,'Digits only')});
SMS_TYPES.forEach(([k])=>{const t=v('s_tp_'+k);if(!t||t.length>1000)bad('s_tp_'+k,'Template required (max 1000 characters)');const u=[...t.matchAll(/\{(\w+)\}/g)].map(m=>m[1]).filter(p=>!SMS_PH.includes(p));if(u.length)bad('s_tp_'+k,'Unknown placeholder: {'+u[0]+'}')});
if(!ok)return toast('Fix the highlighted fields – previous settings kept');
const prev=JSON.stringify(c);Object.assign(c,{enabled:$('#s_en').checked,auto:$('#s_auto').checked,backend:be,sender:v('s_sd'),entity:v('s_en2'),lang:$('#s_lg').value});c.tid.def=v('s_t0');SMS_TYPES.forEach(([k])=>{c.tpl[k]=v('s_tp_'+k);c.tid[k]=v('s_ti_'+k)});
const k=$('#ak');if(k&&k.value)sessKey=k.value;if(!save()){db.settings.sms=JSON.parse(prev);return toast('Could not save – storage error')}render();toast('SMS settings saved')}
async function smsTest(){const c=smsCfg();if(!c.backend){c.status='Not Configured';c.lastTest=new Date().toISOString();c.lastResult='Backend URL not set';save();return render()}
c.status='Testing';render();let st='Test Failed',det='';try{try{c.gw=await api('/api/sms/status')}catch(_){c.gw=null}const r=await api('/api/sms/test-connection',{});st=r.status==='auth_failed'?'Authentication Failed':r.status==='invalid_config'?'Invalid Configuration':(r.status||'Test Failed');det=r.detail||r.error||''}catch(_){st='Gateway Unavailable';det='Backend could not be reached (check URL, HTTPS, CORS and that it is running)'}
c.status=st;c.lastTest=new Date().toISOString();c.lastResult=String(det).slice(0,300);save();render()}
async function smsTestSend(){const c=smsCfg(),n=normMobile($('#ts_n').value),msg=$('#ts_m').value.trim();$('#e_ts_n').textContent='';if(!n){$('#e_ts_n').textContent='Enter a valid 10-digit Indian mobile number';return warn('Invalid Mobile Number','Please enter a valid 10-digit Indian mobile number.')}
if(!msg||msg.length>1000)return toast('Enter a test message (max 1000 characters)');if(smsBusy.test)return;smsBusy.test=1;
const log={id:uid('S-'),pid:'TEST',type:'test',invNo:'TEST',to:'+91'+n,body:msg,status:'Pending',ts:new Date().toISOString(),resp:'',err:'',mid:''};db.sms.push(log);
try{log.resp=String(await smsTransport(log)).slice(0,300);log.status='Sent'}catch(er){log.status='Failed';log.err=String(er.message).slice(0,300)}smsBusy.test=0;save();render();toast(log.status==='Sent'?'Test SMS accepted by gateway'+(log.mid?' (ref '+log.mid+')':''):'Test SMS failed: '+log.err)}
function smsSection(){return`<div class="card"><h2>SMS delivery log</h2><p class="sub">“Sent” = accepted by the gateway. Handset delivery is not confirmed unless the provider reports it.</p>${T(['Time','To','Invoice','Type','Status','Message ID','Detail'],[...db.sms].reverse().slice(0,30).map(s=>`<tr><td>${s.ts.slice(0,16).replace('T',' ')}</td><td>${e(s.to)}</td><td>${s.invNo}</td><td>${e(s.type||'purchase')}</td><td>${smsB(s.status)}</td><td>${e(s.mid||'')}</td><td style="white-space:normal;max-width:300px">${e(s.err||s.resp||'')}</td></tr>`))}</div>`}

load();render();boot();
</script></body></html>
