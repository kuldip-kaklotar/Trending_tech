<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>VoltTrack – Bike Battery Manager</title>
<style>
:root{--navy:#0B1220;--blue:#2563EB;--green:#22C55E;--bg:#F3F6FA;--card:#fff;--tx:#1E293B;--mut:#64748B;--bd:#E2E8F0;--amb:#F59E0B;--red:#EF4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#131C2E;--tx:#E2E8F0;--mut:#94A3B8;--bd:#24304A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#131C2E;--tx:#E2E8F0;--mut:#94A3B8;--bd:#24304A;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--navy);color:#cbd5e1;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{color:#fff;font-weight:700;font-size:18px;padding:4px 10px 16px}.logo span{color:var(--green)}
nav a{display:flex;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:.15s}
nav a:hover{background:#1e293b;color:#fff}nav a.on{background:var(--blue);color:#fff}
main{padding:22px;min-width:0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}.sub{color:var(--mut);margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.06);margin-bottom:14px}
.grid .card{margin:0}.stat b{display:block;font-size:24px}.stat small{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.sp{flex:1}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-size:12px;text-transform:uppercase}
button,.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;transition:.15s}button:hover{filter:brightness(1.1)}
button.g{background:var(--green);color:#052e16}button.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--red)}button.s{padding:4px 9px;font-size:12px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.badge{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;display:inline-block}
.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.info{background:#dbeafe;color:#1e40af}
dialog{border:0;border-radius:14px;padding:20px;width:min(720px,94vw);max-height:92vh;background:var(--card);color:var(--tx)}dialog::backdrop{background:rgba(2,6,23,.6)}
.bars{display:flex;gap:10px;align-items:flex-end;height:140px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars i{display:block;background:var(--blue);border-radius:6px 6px 0 0;margin-bottom:4px}
.empty{padding:24px;text-align:center;color:var(--mut)}.bf{border-color:var(--red)!important;outline:1px solid var(--red)}.fe{color:var(--red);font-size:12px}#wdlg,#cdlg{width:min(460px,94vw)}
#toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99}
.inv{background:#fff;color:#111;padding:18px;font-size:13px}.inv table th{color:#555}.inv td,.inv th{padding:6px 8px}.tot{margin-left:auto;width:280px}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{height:auto;position:static;display:flex;overflow-x:auto;padding:8px}.logo{display:none}nav a{white-space:nowrap}}
@media print{.app,#toast,.np{display:none!important}dialog{position:static;box-shadow:none;width:100%;max-height:none;padding:0}dialog::backdrop{display:none}body{background:#fff}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<dialog id="dlg"></dialog><dialog id="cdlg"></dialog><dialog id="wdlg"></dialog><div id="toast"></div>
<script>
const K='volttrack.v1',$=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const addM=(d,m)=>{const x=new Date(d);x.setMonth(x.getMonth()+Number(m));return x.toISOString().slice(0,10)};
const uid=p=>p+Math.random().toString(36).slice(2,8);
let db,view='Dashboard',arg=null,q='';
function seed(){const c=[{id:'C-1001',name:'Rahul Patel',mobile:'9876543210',alt:'',email:'rahul@example.com',address:'12 Shivam Society',city:'Ahmedabad',state:'Gujarat',pin:'380015',reg:'GJ01AB1234',brand:'Honda',model:'Activa 6G',chassis:'',created:'2026-01-10'},{id:'C-1002',name:'Meera Shah',mobile:'9898012345',alt:'',email:'',address:'45 Satellite Rd',city:'Ahmedabad',state:'Gujarat',pin:'380054',reg:'GJ05CD5678',brand:'TVS',model:'Jupiter',chassis:'',created:'2026-03-02'},{id:'C-1003',name:'Imran Khan',mobile:'9825011111',alt:'9825022222',email:'',address:'7 Navrangpura',city:'Ahmedabad',state:'Gujarat',pin:'380009',reg:'GJ27EF9012',brand:'Bajaj',model:'Pulsar 150',chassis:'',created:'2026-05-15'}];
const p=[{id:'B-001',brand:'Exide',model:'XLTZ5',type:'Lead Acid',cap:'5Ah',volt:'12V',buy:900,sell:1450,wm:24,wterms:'Free replacement for manufacturing defects',supplier:'PowerHub Traders',stock:14,min:5,desc:'Bike tracker backup battery'},{id:'B-002',brand:'Amaron',model:'AAM-PR-9',type:'Li-ion',cap:'9Ah',volt:'12V',buy:1500,sell:2300,wm:18,wterms:'Pro-rata after 12 months',supplier:'VoltWorld',stock:3,min:5,desc:'Long-life tracker battery'},{id:'B-003',brand:'Livguard',model:'LG-4L',type:'Gel',cap:'4Ah',volt:'12V',buy:700,sell:1150,wm:12,wterms:'Warranty void on physical damage',supplier:'PowerHub Traders',stock:20,min:6,desc:'Compact gel battery'}];
const s={biz:'VoltTrack Batteries',addr:'Shop 5, Ring Road, Ahmedabad, Gujarat',phone:'+91 99999 00000',gstin:'24ABCDE1234F1Z5',gst:18,terms:'Goods once sold will not be taken back. Warranty as per terms stated above.',soon:30,inv:3};
const mk=(n,ci,bi,date,qty,disc,paid,m,ser)=>calc({id:'P-'+(1000+n),invNo:'INV-'+String(n).padStart(4,'0'),cid:ci,bid:bi,date,install:date,qty,disc,gst:18,method:m,paid,serial:ser,notes:'',claims:[]},c,p);
return{customers:c,products:p,settings:s,purchases:[mk(1,'C-1001','B-001','2026-02-01',1,0,1711,'UPI','EX-5501'),mk(2,'C-1002','B-002','2026-06-20',1,100,1000,'Cash','AM-9002'),mk(3,'C-1003','B-003','2025-12-01',2,50,2500,'Card','LG-4403')]}}
function calc(x,cs=db.customers,ps=db.products){const c=cs.find(a=>a.id===x.cid),b=ps.find(a=>a.id===x.bid);
x.cust={...c};x.bat={brand:b.brand,model:b.model,wm:b.wm,wterms:b.wterms};x.unit=x.unit??b.sell;
x.sub=x.qty*x.unit;x.taxable=Math.max(0,x.sub-x.disc);x.tax=+(x.taxable*x.gst/100).toFixed(2);x.total=+(x.taxable+x.tax).toFixed(2);
x.paid=Math.min(x.paid,x.total);x.bal=+(x.total-x.paid).toFixed(2);x.pstat=x.bal<=0?'Paid':x.paid>0?'Partially Paid':'Unpaid';
x.wstart=x.date;x.wend=addM(x.date,x.bat.wm);return x}
function load(){try{db=JSON.parse(localStorage.getItem(K))}catch(_){}if(!db)db=seed();migrate();save()}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(_){}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function ws(x){const d=Math.ceil((new Date(x.wend)-new Date(today()))/864e5);return d<0?['Warranty Expired','bad',d]:d<=db.settings.soon?['Expiring Soon','warn',d]:['Active Warranty','ok',d]}
const wb=x=>{const[a,b]=ws(x);return`<span class="badge ${b}">${a}</span>`};
const pb=s=>`<span class="badge ${s==='Paid'?'ok':s==='Unpaid'?'bad':'warn'}">${s}</span>`;
const cust=id=>db.customers.find(c=>c.id===id),prod=id=>db.products.find(c=>c.id===id);
const T=(h,rows)=>rows.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`:'<div class="empty">Nothing here yet.</div>';
const NAV=[['Dashboard','▦'],['Customers','👤'],['Battery Products','🔋'],['Battery Stock','📦'],['Purchases','🧾'],['Invoices','📄'],['Warranty','🛡'],['Suppliers','🚚'],['Reports','📊'],['Settings','⚙']];
function go(v,a=null){view=v;arg=a;q='';render()}
function render(){$('#nav').innerHTML='<div class="logo">⚡ Volt<span>Track</span></div>'+NAV.map(([n,i])=>`<a class="${view===n||(view==='Profile'&&n==='Customers')?'on':''}" onclick="go('${n}')">${i} ${n}</a>`).join('');
$('#main').innerHTML=V[view]();}
const srch=ph=>`<input style="max-width:280px" placeholder="${ph}" value="${e(q)}" oninput="q=this.value;const p=this.selectionStart;render();const i=document.querySelector('main input');i.focus();i.setSelectionRange(p,p)">`;
const has=(q,...f)=>!q||f.some(x=>String(x||'').toLowerCase().includes(q.toLowerCase()));
const V={
Dashboard(){const P=db.purchases,m=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const k=d.toISOString().slice(0,7);m.push([d.toLocaleString('en',{month:'short'}),P.filter(x=>x.date.startsWith(k)).reduce((a,x)=>a+x.total,0)])}
const mx=Math.max(1,...m.map(a=>a[1])),low=db.products.filter(p=>p.stock<=p.min);
return`<h1>Dashboard</h1><div class="sub">Overview of your battery business</div><div class="row"><button onclick="custForm()">+ Add Customer</button><button class="g" onclick="purForm()">Record Purchase</button><button class="o" onclick="go('Invoices')">Generate Invoice</button></div>
<div class="grid">${[['Customers',db.customers.length],['Batteries sold',P.reduce((a,x)=>a+x.qty,0)],['Total sales',money(P.reduce((a,x)=>a+x.total,0))],['Invoices',P.length],['Under warranty',P.filter(x=>ws(x)[2]>=0).length]].map(([l,v])=>`<div class="card stat"><small>${l}</small><b>${v}</b></div>`).join('')}</div>
${low.length?`<div class="card"><span class="badge warn">Low stock</span> ${low.map(p=>e(p.brand+' '+p.model)+' ('+p.stock+')').join(', ')}</div>`:''}
<div class="card"><h2>Monthly sales</h2><div class="bars">${m.map(([l,v])=>`<div><i style="height:${v/mx*110}px"></i>${l}</div>`).join('')}</div></div>
<div class="card"><h2>Recent purchases</h2>${T(['Invoice','Customer','Battery','Total','Status'],[...P].reverse().slice(0,5).map(x=>`<tr><td>${x.invNo}</td><td>${e(x.cust.name)}</td><td>${e(x.bat.brand+' '+x.bat.model)}</td><td>${money(x.total)}</td><td>${pb(x.pstat)}</td></tr>`))}</div>
<div class="card"><h2>Recent customers</h2>${T(['Name','Mobile','Bike'],[...db.customers].reverse().slice(0,4).map(c=>`<tr><td>${e(c.name)}</td><td>${e(c.mobile)}</td><td>${e(c.reg)}</td></tr>`))}</div>`},
Customers(){const L=db.customers.filter(c=>has(q,c.name,c.mobile,c.reg));return`<h1>Customers</h1><div class="row">${srch('Search name, mobile or bike no.')}<div class="sp"></div><button onclick="custForm()">+ Add customer</button></div><div class="card">${T(['ID','Name','Mobile','Bike','Reg. no.','Actions'],L.map(c=>`<tr><td>${c.id}</td><td>${e(c.name)}</td><td>${e(c.mobile)}</td><td>${e(c.brand+' '+c.model)}</td><td>${e(c.reg)}</td><td><button class="s" onclick="go('Profile','${c.id}')">View</button> <button class="s o" onclick="custForm('${c.id}')">Edit</button> <button class="s d" onclick="delCust('${c.id}')">Delete</button></td></tr>`))}</div>`},
Profile(){const c=cust(arg);if(!c)return'<div class="empty">Not found</div>';const P=db.purchases.filter(x=>x.cid===c.id);
return`<button class="o s" onclick="go('Customers')">← Back</button><h1>${e(c.name)} <small style="color:var(--mut)">${c.id}</small></h1><div class="grid"><div class="card stat"><small>Total spent</small><b>${money(P.reduce((a,x)=>a+x.total,0))}</b></div><div class="card stat"><small>Outstanding</small><b>${money(P.reduce((a,x)=>a+x.bal,0))}</b></div></div>
<div class="card"><h2>Details</h2><p>${e(c.mobile)} ${c.alt?'/ '+e(c.alt):''} ${c.email?'· '+e(c.email):''}<br>${e(c.address)}, ${e(c.city)}, ${e(c.state)} ${e(c.pin)}<br>Bike: ${e(c.brand+' '+c.model)} · ${e(c.reg)} ${c.chassis?'· Chassis '+e(c.chassis):''}</p></div>
<div class="card"><h2>Purchase history</h2>${T(['Date','Invoice','Battery','Serial','Paid','Warranty','',''],P.map(x=>`<tr><td>${x.date}</td><td>${x.invNo}</td><td>${e(x.bat.brand+' '+x.bat.model)}</td><td>${e(x.serial)}</td><td>${money(x.paid)} ${pb(x.pstat)}</td><td>${wb(x)}</td><td><button class="s" onclick="showInv('${x.id}')">Invoice</button></td></tr>`))}</div>`},
'Battery Products'(){const L=db.products.filter(p=>has(q,p.brand,p.model,p.type));return`<h1>Battery products</h1><div class="row">${srch('Search battery')}<div class="sp"></div><button onclick="prodForm()">+ Add battery</button></div><div class="card">${T(['ID','Battery','Type','Cap/Volt','Cost','Price','Warranty','Supplier','Stock',''],L.map(p=>`<tr><td>${p.id}</td><td>${e(p.brand+' '+p.model)}</td><td>${e(p.type)}</td><td>${e(p.cap+' / '+p.volt)}</td><td>${money(p.buy)}</td><td>${money(p.sell)}</td><td>${p.wm} mo</td><td>${e(p.supplier)}</td><td>${p.stock}</td><td><button class="s o" onclick="prodForm('${p.id}')">Edit</button> <button class="s d" onclick="delProd('${p.id}')">Delete</button></td></tr>`))}</div>`},
'Battery Stock'(){return`<h1>Battery stock</h1><div class="sub">Stock reduces automatically on every purchase</div><div class="card">${T(['Battery','In stock','Reorder level','Status','Stock value',''],db.products.map(p=>`<tr><td>${e(p.brand+' '+p.model)}</td><td>${p.stock}</td><td>${p.min}</td><td>${p.stock<=0?'<span class="badge bad">Out of stock</span>':p.stock<=p.min?'<span class="badge warn">Low stock</span>':'<span class="badge ok">OK</span>'}</td><td>${money(p.stock*p.buy)}</td><td><button class="s" onclick="addStock('${p.id}')">+ Add stock</button></td></tr>`))}</div>`},
Purchases(){const L=db.purchases.filter(x=>has(q,x.cust.name,x.cust.mobile,x.serial,x.invNo));return`<h1>Battery purchases</h1><div class="row">${srch('Search customer, serial, invoice')}<div class="sp"></div><button class="g" onclick="purForm()">+ Record purchase</button></div><div class="card">${T(['ID','Date','Customer','Bike','Battery','Serial','Total','Balance','Status',''],[...L].reverse().map(x=>`<tr><td>${x.id}</td><td>${x.date}</td><td>${e(x.cust.name)}</td><td>${e(x.cust.reg)}</td><td>${e(x.bat.brand+' '+x.bat.model)} ×${x.qty}</td><td>${e(x.serial)}</td><td>${money(x.total)}</td><td>${money(x.bal)}</td><td>${pb(x.pstat)}</td><td><button class="s" onclick="showInv('${x.id}')">Invoice</button> ${x.bal>0?`<button class="s g" onclick="pay('${x.id}')">Pay</button>`:''}</td></tr>`))}</div>`},
Invoices(){const L=db.purchases.filter(x=>has(q,x.invNo,x.cust.name,x.cust.mobile,x.date));return`<h1>Invoices</h1><div class="row">${srch('Invoice no, name, mobile, date')}</div><div class="card">${T(['Invoice','Date','Customer','Mobile','Total','Status',''],[...L].reverse().map(x=>`<tr><td>${x.invNo}</td><td>${x.date}</td><td>${e(x.cust.name)}</td><td>${e(x.cust.mobile)}</td><td>${money(x.total)}</td><td>${pb(x.pstat)}</td><td><button class="s" onclick="showInv('${x.id}')">View / Print</button></td></tr>`))}</div>`},
Warranty(){const L=db.purchases.filter(x=>has(q,x.serial,x.cust.mobile,x.cust.name));return`<h1>Warranty management</h1><div class="row">${srch('Serial number or mobile')}</div><div class="card">${T(['Serial','Customer','Purchased','Starts','Expires','Remaining','Status','Claims',''],L.map(x=>`<tr><td>${e(x.serial)}</td><td>${e(x.cust.name)}<br><small>${e(x.cust.mobile)}</small></td><td>${x.date}</td><td>${x.wstart}</td><td>${x.wend}</td><td>${ws(x)[2]>=0?ws(x)[2]+' days':'—'}</td><td>${wb(x)}</td><td>${x.claims.length?x.claims.map(c=>`${c.date}: ${e(c.note)}`).join('<br>'):'None'}</td><td><button class="s o" onclick="claim('${x.id}')">+ Claim</button></td></tr>`))}</div>`},
Suppliers(){const m={};db.products.forEach(p=>{(m[p.supplier]??={n:0,s:0,v:0});m[p.supplier].n++;m[p.supplier].s+=p.stock;m[p.supplier].v+=p.stock*p.buy});return`<h1>Suppliers</h1><div class="sub">Derived from the supplier name on each battery product</div><div class="card">${T(['Supplier','Products','Units in stock','Stock value'],Object.entries(m).map(([k,v])=>`<tr><td>${e(k)}</td><td>${v.n}</td><td>${v.s}</td><td>${money(v.v)}</td></tr>`))}</div>`},
Reports(){const P=db.purchases,by={};P.forEach(x=>by[x.bat.brand]=(by[x.bat.brand]||0)+x.total);const f=window.rf||'',L=P.filter(x=>!f||x.date>=f);
return`<h1>Sales reports</h1><div class="row"><label style="margin:0">From</label><input type="date" style="max-width:170px" value="${f}" onchange="window.rf=this.value;render()"></div>
<div class="grid"><div class="card stat"><small>Sales in range</small><b>${money(L.reduce((a,x)=>a+x.total,0))}</b></div><div class="card stat"><small>Collected</small><b>${money(L.reduce((a,x)=>a+x.paid,0))}</b></div><div class="card stat"><small>Outstanding</small><b>${money(L.reduce((a,x)=>a+x.bal,0))}</b></div></div>
<div class="card"><h2>Sales by brand</h2>${T(['Brand','Sales'],Object.entries(by).map(([k,v])=>`<tr><td>${e(k)}</td><td>${money(v)}</td></tr>`))}</div>
<div class="card"><h2>Outstanding payments</h2>${T(['Customer','Mobile','Invoice','Balance'],P.filter(x=>x.bal>0).map(x=>`<tr><td>${e(x.cust.name)}</td><td>${e(x.cust.mobile)}</td><td>${x.invNo}</td><td>${money(x.bal)}</td></tr>`))}</div>
<div class="card"><h2>Warranty expiry</h2>${T(['Customer','Serial','Expires','Status'],[...P].sort((a,b)=>a.wend>b.wend?1:-1).map(x=>`<tr><td>${e(x.cust.name)}</td><td>${e(x.serial)}</td><td>${x.wend}</td><td>${wb(x)}</td></tr>`))}</div>`},
Settings(){return`<h1>Settings</h1><div class="card"><button onclick="setForm()">Edit business &amp; tax settings</button> <button class="d" onclick="if(confirm('Reset all data to the sample records?')){db=seed();migrate();save();render()}">Reset sample data</button></div>${coSection()}${smsSection()}`}};
// dialogs
function dlg(h){$('#dlg').innerHTML=h;if(!$('#dlg').open)$('#dlg').showModal()}
function close_(){$('#dlg').close()}
function form(title,fields,val,onSave){window._save=onSave;dlg(`<h2>${title}</h2><form onsubmit="event.preventDefault();formSubmit(this)"><div class="f">${fields.map(([n,l,t,o])=>`<div><label>${l}</label>${t==='brand'?brandSel(val[n]):t==='select'?`<select name="${n}">${o.map(x=>`<option ${x===val[n]?'selected':''}>${x}</option>`).join('')}</select>`:t==='area'?`<textarea name="${n}">${e(val[n])}</textarea>`:`<input name="${n}" type="${t||'text'}" value="${e(val[n])}" ${o==='req'?'required':''} ${t==='number'?'step="any" min="0"':''}>`}<div class="fe"></div></div>`).join('')}</div><div class="row" style="margin-top:14px"><button>Save</button><button type="button" class="o" onclick="close_()">Cancel</button></div></form>`)}
function custForm(id){const v=id?cust(id):{state:'Gujarat',city:'Ahmedabad'};form(id?'Edit customer':'Add customer',[['name','Full name',0,'req'],['mobile','Mobile',0,'req'],['alt','Alternate mobile'],['email','Email (optional)','email'],['address','Address'],['city','City'],['state','State'],['pin','PIN code'],['reg','Bike registration no.',0,'req'],['brand','Bike brand'],['model','Bike model'],['chassis','Chassis no. (optional)']],v,d=>{const f=$('#dlg form'),m=normMobile(d.mobile);if(!m){fieldErr(f,'mobile','Enter a valid 10-digit Indian mobile number');warn('Invalid Mobile Number','Please enter a valid 10-digit Indian mobile number before saving customer details.',true);return false}d.mobile=m;if(d.alt){const a=normMobile(d.alt);if(!a){fieldErr(f,'alt','Enter a valid 10-digit number or leave blank');return false}d.alt=a}if(id)Object.assign(v,d);else db.customers.push({...d,id:'C-'+(1000+db.customers.length+1+Math.floor(Math.random()*90)),created:today()});save();render();toast('Customer saved')})}
function delCust(id){if(db.purchases.some(x=>x.cid===id))return toast('Customer has purchase history – cannot delete');if(confirm('Delete customer?')){db.customers=db.customers.filter(c=>c.id!==id);save();render()}}
function prodForm(id){const v=id?prod(id):{type:'Li-ion',volt:'12V',wm:12,stock:0,min:5};form(id?'Edit battery':'Add battery',[['brand','Battery company / brand','brand'],['model','Model',0,'req'],['type','Type'],['cap','Capacity'],['volt','Voltage'],['buy','Purchase price','number'],['sell','Selling price','number'],['wm','Warranty (months)','number'],['supplier','Supplier'],['stock','Stock qty','number'],['min','Low-stock level','number'],['wterms','Warranty terms','area'],['desc','Description','area']],v,d=>{const f=$('#dlg form'),co=db.companies.find(c=>c.name.toLowerCase()===d.brand.trim().toLowerCase()&&(c.active||c.id===v.brandId));if(!co){fieldErr(f,'brand','Choose an active company from the list, or use + Add Company');return false}if(!d.model.trim()){fieldErr(f,'model','Battery model is required');return false}d.brand=co.name;d.brandId=co.id;['buy','sell','wm','stock','min'].forEach(k=>d[k]=+d[k]||0);if(id)Object.assign(v,d);else db.products.push({...d,id:'B-'+String(db.products.length+1).padStart(3,'0')+Math.floor(Math.random()*9)});save();render();toast('Battery saved')})}
function delProd(id){if(db.purchases.some(x=>x.bid===id))return toast('Used in purchases – cannot delete');db.products=db.products.filter(p=>p.id!==id);save();render()}
function addStock(id){form('Add stock',[['n','Quantity received','number','req']],{n:1},d=>{prod(id).stock+=+d.n;save();render();toast('Stock updated')})}
function claim(id){form('Warranty claim',[['note','Claim notes','area']],{},d=>{db.purchases.find(x=>x.id===id).claims.push({date:today(),note:d.note});save();render()})}
function pay(id){const x=db.purchases.find(p=>p.id===id);form('Record payment (balance '+money(x.bal)+')',[['a','Amount','number','req']],{a:x.bal},d=>{const a=+d.a;if(a<=0||a>x.bal)return toast('Invalid amount');x.paid+=a;calc(x);save();render();toast('Payment recorded')})}
function setForm(){const s=db.settings;form('Settings',[['biz','Business name'],['addr','Address'],['phone','Phone'],['gstin','GSTIN'],['gst','Default GST %','number'],['soon','“Expiring soon” days','number'],['terms','Invoice terms','area']],s,d=>{d.gst=+d.gst;d.soon=+d.soon;Object.assign(s,d);save();render()})}
function purForm(){if(!db.customers.length||!db.products.length)return toast('Add a customer and a battery first');const o=(a,f)=>a.map(f).join('');
dlg(`<h2>Record battery purchase</h2><form onsubmit="event.preventDefault();savePur(this)"><div class="f">
<div><label>Customer</label><select name="cid" oninput="sum()">${o(db.customers,c=>`<option value="${c.id}">${e(c.name+' · '+c.reg)}</option>`)}</select></div>
<div><label>Battery</label><select name="bid" oninput="sum()">${o(db.products,p=>`<option value="${p.id}">${e(p.brand+' '+p.model)} (stock ${p.stock})</option>`)}</select></div>
<div><label>Serial number</label><input name="serial"></div><div><label>Purchase date</label><input type="date" name="date" value="${today()}"></div><div><label>Installation date</label><input type="date" name="install"></div>
<div><label>Quantity</label><input type="number" name="qty" value="1" min="1" oninput="sum()"></div><div><label>Discount (₹)</label><input type="number" name="disc" value="0" min="0" oninput="sum()"></div><div><label>GST %</label><input type="number" name="gst" value="${db.settings.gst}" min="0" step="any" oninput="sum()"></div>
<div><label>Payment method</label><select name="method"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option></select></div><div><label>Amount paid (₹)</label><input type="number" name="paid" value="0" min="0" oninput="sum()"></div><div><label>Notes</label><input name="notes"></div></div>
<div class="card" id="sum" style="margin:12px 0"></div><div class="row"><button class="g">Save &amp; create invoice</button><button type="button" class="o" onclick="close_()">Cancel</button></div></form>`);sum()}
function read(f){const d=Object.fromEntries(new FormData(f));['qty','disc','gst','paid'].forEach(k=>d[k]=+d[k]||0);return d}
function sum(){const d=read($('#dlg form')),b=prod(d.bid),t=calc({...d,claims:[]});$('#sum').innerHTML=`Subtotal ${money(t.sub)} · Discount ${money(t.disc)} · Tax ${money(t.tax)}<br><b>Total ${money(t.total)}</b> · Paid ${money(t.paid)} · Balance ${money(t.bal)} · ${pb(t.pstat)} · Warranty till ${t.wend}`}
function savePur(f){const d=read(f),b=prod(d.bid);if(f.dataset.busy||!validPur(f,d,b))return;f.dataset.busy=1;f.querySelector('button.g').disabled=true;d.serial=d.serial.trim();if(d.qty<1||d.qty>b.stock)return toast('Insufficient stock ('+b.stock+' available)');if(db.purchases.some(x=>x.serial===d.serial))return toast('Serial number already used');if(d.paid<0||d.disc<0)return toast('Invalid amounts');
const n=db.settings.inv++;const x=calc({...d,id:'P-'+(1000+db.purchases.length+1),invNo:'INV-'+String(n).padStart(4,'0'),claims:[]});b.stock-=d.qty;db.purchases.push(x);save();close_();render();toast('Purchase saved, invoice '+x.invNo);showInv(x.id);smsSend(x.id)}
function showInv(id){const x=db.purchases.find(p=>p.id===id),s=db.settings,c=x.cust;
dlg(`<div class="row np"><button onclick="print()">Print / Save as PDF</button><button class="o" ${lastSms(x.id)?.status==='Pending'?'disabled':''} onclick="smsSend('${x.id}')">${smsLabel(x.id)}</button> ${lastSms(x.id)?smsB(lastSms(x.id).status):''}<button class="o" onclick="close_()">Close</button></div><div class="inv"><div class="row"><div><b style="font-size:18px">⚡ ${e(s.biz)}</b><br>${e(s.addr)}<br>${e(s.phone)} ${s.gstin?'· GSTIN '+e(s.gstin):''}</div><div class="sp"></div><div style="text-align:right"><b>TAX INVOICE</b><br>${x.invNo}<br>Date: ${x.date}</div></div><hr>
<p><b>Bill to:</b> ${e(c.name)}, ${e(c.address)}, ${e(c.city)} ${e(c.pin)}<br>Phone ${e(c.mobile)} · Bike ${e(c.brand+' '+c.model)} (${e(c.reg)})</p>
<table><tr><th>Item</th><th>Serial</th><th>Qty</th><th>Rate</th><th>Amount</th></tr><tr><td>${e(x.bat.brand+' '+x.bat.model)}</td><td>${e(x.serial)}</td><td>${x.qty}</td><td>${money(x.unit)}</td><td>${money(x.sub)}</td></tr></table>
<table class="tot"><tr><td>Discount</td><td>−${money(x.disc)}</td></tr><tr><td>Taxable amount</td><td>${money(x.taxable)}</td></tr><tr><td>CGST ${x.gst/2}%</td><td>${money(x.tax/2)}</td></tr><tr><td>SGST ${x.gst/2}%</td><td>${money(x.tax/2)}</td></tr><tr><td><b>Grand total</b></td><td><b>${money(x.total)}</b></td></tr><tr><td>Paid (${x.method})</td><td>${money(x.paid)}</td></tr><tr><td>Balance due</td><td>${money(x.bal)}</td></tr></table>
<p>Payment status: <b>${x.pstat}</b><br>Warranty: ${x.wstart} to ${x.wend} (${x.bat.wm} months). ${e(x.bat.wterms)}</p><p style="font-size:12px;color:#555">${e(s.terms)}</p><p style="margin-top:40px;text-align:right">Authorized signature ____________</p></div>`)}
function migrate(){db.sms??=[];if(!db.companies){const n=['Exide','Amaron','Livguard','SF Sonic','Tata Green','Other'];db.products.forEach(p=>{if(!n.some(x=>x.toLowerCase()===p.brand.toLowerCase()))n.push(p.brand)});db.companies=n.map((x,i)=>({id:'CO-'+String(i+1).padStart(3,'0'),name:x,code:'',desc:'',web:'',phone:'',active:true}))}db.products.forEach(p=>{const c=db.companies.find(c=>c.name.toLowerCase()===p.brand.toLowerCase());if(c){p.brandId=c.id;p.brand=c.name}})}
function formSubmit(f){if(f.dataset.busy)return;clearErr(f);f.dataset.busy=1;if(_save(Object.fromEntries(new FormData(f)))===false){delete f.dataset.busy;return}close_()}
function clearErr(f){f.querySelectorAll('.bf').forEach(x=>x.classList.remove('bf'));f.querySelectorAll('.fe').forEach(x=>x.textContent='')}
function fieldErr(f,n,m){const el=f.elements[n];if(!el)return;el.classList.add('bf');const w=el.parentElement;let fe=w.querySelector('.fe');if(!fe){fe=document.createElement('div');fe.className='fe';w.appendChild(fe)}fe.textContent=m;el.focus()}
function warn(t,m,cancel){$('#wdlg').innerHTML=`<h2>${e(t)}</h2><p>${e(m)}</p><div class="row"><button onclick="$('#wdlg').close()">OK</button>${cancel?`<button class="o" onclick="$('#wdlg').close();close_()">Cancel</button>`:''}</div>`;$('#wdlg').showModal()}
function normMobile(s){let d=String(s||'').replace(/[\s\-().]/g,'');if(/^\+91/.test(d))d=d.slice(3);else if(/^91\d{10}$/.test(d))d=d.slice(2);else if(/^0\d{10}$/.test(d))d=d.slice(1);return /^[6-9]\d{9}$/.test(d)&&!/^(\d)\1{9}$/.test(d)?d:''}
function validPur(f,d,b){clearErr(f);const c=cust(d.cid),bad=(n,m)=>{fieldErr(f,n,m);warn('Check purchase details',m);return false};
if(!c)return bad('cid','Please select a customer.');if(!normMobile(c.mobile))return bad('cid','This customer has no valid mobile number. Edit the customer first.');
if(!b)return bad('bid','Please select a battery product.');if(!d.serial.trim())return bad('serial','Battery serial number is required.');
if(db.purchases.some(x=>x.serial===d.serial.trim()))return bad('serial','This serial number is already recorded.');
if(!d.date||isNaN(new Date(d.date)))return bad('date','Enter a valid purchase date.');if(d.date>today())return bad('date','Purchase date cannot be in the future.');
if(!(d.qty>0)||!Number.isInteger(d.qty))return bad('qty','Quantity must be a whole number above zero.');if(d.qty>b.stock)return bad('qty','Only '+b.stock+' in stock.');
if(!(b.sell>0))return bad('bid','This battery has no valid selling price.');const t=calc({...d,claims:[]});
if(d.disc<0||d.disc>t.sub)return bad('disc','Discount must be between 0 and the subtotal.');if(!(t.total>0))return bad('disc','Final amount must be above zero.');
if(d.paid<0||d.paid>t.total)return bad('paid','Amount paid cannot exceed the total ('+money(t.total)+').');return true}
function brandSel(v){return `<input name="brand" list="bl" autocomplete="off" placeholder="Search company…" value="${e(v)}"><datalist id="bl">${db.companies.filter(c=>c.active).map(c=>`<option value="${e(c.name)}">`).join('')}</datalist><div class="fe"></div><button type="button" class="s o" style="margin-top:6px" onclick="coDialog('',true)">+ Add Company</button>`}
function coDialog(id,inForm){const v=id?db.companies.find(c=>c.id===id):{};const i=(n,l)=>`<div><label>${l}</label><input name="${n}" value="${e(v[n])}"><div class="fe"></div></div>`;$('#cdlg').innerHTML=`<h2>${id?'Edit':'Add'} battery company</h2><form onsubmit="event.preventDefault();coSubmit(this,'${id||''}',${!!inForm})"><div class="f">${i('name','Company name')}${i('code','Code (optional)')}${i('phone','Contact number (optional)')}${i('web','Website (optional)')}${i('desc','Description (optional)')}<div><label>Status</label><select name="active"><option ${v.active!==false?'selected':''}>Active</option><option ${v.active===false?'selected':''}>Inactive</option></select></div></div><div class="row" style="margin-top:14px"><button>Save</button><button type="button" class="o" onclick="$('#cdlg').close()">Cancel</button></div></form>`;$('#cdlg').showModal()}
function coSubmit(f,id,inForm){if(f.dataset.busy)return;clearErr(f);const d=Object.fromEntries(new FormData(f));d.name=d.name.trim();if(!d.name)return fieldErr(f,'name','Company name is required');if(db.companies.some(c=>c.id!==id&&c.name.toLowerCase()===d.name.toLowerCase()))return fieldErr(f,'name','This company already exists');d.active=d.active==='Active';let c;if(id){c=db.companies.find(x=>x.id===id);Object.assign(c,d);db.products.forEach(p=>{if(p.brandId===id)p.brand=c.name})}else{c={...d,id:'CO-'+String(db.companies.length+1).padStart(3,'0')+Math.floor(Math.random()*9)};db.companies.push(c)}save();$('#cdlg').close();if(inForm){const i=document.querySelector('#dlg input[name=brand]');if(i){i.value=c.name;clearErr($('#dlg form'))}toast('Company added and selected')}else{render();toast('Company saved')}}
function togCo(id){const c=db.companies.find(x=>x.id===id);c.active=!c.active;save();render()}
function coSection(){const L=db.companies.filter(c=>has(q,c.name,c.code));return`<div class="card"><h2>Battery Companies / Brands</h2><div class="row">${srch('Search companies')}<div class="sp"></div><button onclick="coDialog()">+ Add Battery Company</button></div>${T(['ID','Company','Code','Phone','Status',''],L.map(c=>`<tr><td>${c.id}</td><td>${e(c.name)}</td><td>${e(c.code)}</td><td>${e(c.phone)}</td><td><span class="badge ${c.active?'ok':'bad'}">${c.active?'Active':'Inactive'}</span></td><td><button class="s o" onclick="coDialog('${c.id}')">Edit</button> <button class="s o" onclick="togCo('${c.id}')">${c.active?'Deactivate':'Activate'}</button></td></tr>`))}</div>`}
const smsB=s=>`<span class="badge ${s==='Sent'?'ok':s==='Failed'?'bad':'warn'}">${s}</span>`;
const lastSms=id=>[...db.sms].reverse().find(s=>s.pid===id);
const smsLabel=id=>{const l=lastSms(id);return !l?'Send SMS':l.status==='Failed'?'Retry SMS':'Resend SMS'};
const dmy=d=>d.split('-').reverse().join('-');
function smsBody(x){return`Dear ${x.cust.name}, your battery purchase has been recorded successfully. Invoice: ${x.invNo}. Battery: ${x.bat.brand} ${x.bat.model}. Purchase Date: ${dmy(x.date)}. Amount: ${money(x.total)}. Warranty: ${x.bat.wm} months (${dmy(x.wstart)} to ${dmy(x.wend)}). Thank you for choosing ${db.settings.biz}.`}
const smsTransport=async()=>{throw new Error('No SMS provider configured')};
const invOpen=()=>$('#dlg').open&&$('#dlg .inv');
async function smsSend(pid){const x=db.purchases.find(p=>p.id===pid),l=lastSms(pid);if(l&&(l.status==='Pending'||(l.status==='Sent'&&!confirm('SMS was already sent. Send again?'))))return;const to=normMobile(cust(x.cid)?.mobile||x.cust.mobile);if(!to){warn('Invalid Mobile Number','No valid mobile number is on record for this customer, so no SMS was sent.');return}
const log={id:uid('S-'),pid,invNo:x.invNo,to:'+91'+to,body:smsBody(x),status:'Pending',ts:new Date().toISOString(),resp:'',err:''};db.sms.push(log);save();if(invOpen())showInv(pid);
try{log.resp=await smsTransport(log);log.status='Sent'}catch(er){log.status='Failed';log.err=er.message}save();if(invOpen())showInv(pid);toast('SMS '+log.status.toLowerCase()+(log.err?': '+log.err:''))}
function smsSection(){return`<div class="card"><h2>SMS delivery log</h2><p><span class="badge warn">No provider configured</span> SMS credentials belong in backend environment variables. This browser-only build can’t reach an SMS gateway, so messages are logged as Failed and can be retried once a backend is connected.</p>${T(['Time','To','Invoice','Status','Detail'],[...db.sms].reverse().map(s=>`<tr><td>${s.ts.slice(0,16).replace('T',' ')}</td><td>${e(s.to)}</td><td>${s.invNo}</td><td>${smsB(s.status)}</td><td>${e(s.err||s.resp||'')}</td></tr>`))}</div>`}
load();render();
</script></body></html>
